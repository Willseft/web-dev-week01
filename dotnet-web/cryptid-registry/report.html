<body>

  <!-- TODO: navbar (same as index.html, with Report marked active) -->
  <nav class="navbar navbar-expand-md bg-success">
    <div class="container">
      <a class="navbar-brand" href="index.html">The Cryptid Registry</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#reportNavbar">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="reportNavbar"></div>
      <div class="navbar-nav">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="registry.html">Registry</a>
        <a class="nav-link active" href="report.html">Report a Sighting</a>
      </div>
    </div>
    </div>
  </nav>

  <!-- TODO: give <main> a container (all pages) — `class="container py-5"` -->
  <main class="container py-5">
    <h1>Report a Sighting</h1>

    <!-- TODO: alert alert-info — "nothing is saved yet" (that's week 6's problem) -->
    <div class="alert alert-info" role="alert">
      Nothing is saved yet—that's week 6's problem.
    </div>

    <!-- TODO: form — form-label + form-control for each field, form-select for the dropdown,
         submit button; keep the form ≤ 8 columns wide on md+ (hint: row + col-md-8) -->
    <div class="row">
      <div class="col-md-8">
        <form>
          <div class="mb-3">
            <label class="form-label" for="name">Your name</label>
            <input class="form-control" type="text" id="name">
          </div>

          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" type="email" id="email">
          </div>

          <div class="mb-3">
            <label class="form-label" for="cryptid">Which one did you see?</label>
            <select class="form-select" id="cryptid">
              <option>Choose…</option>
              <option>The Hodag</option>
              <option>Bigfoot</option>
              <option>Mothman</option>
              <option>The Loch Ness Monster</option>
              <option>The Jersey Devil</option>
              <option>Chupacabra</option>
              <option>Something not in the registry</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label" for="account">What did you see?</label>
            <textarea class="form-control" id="account" rows="4"></textarea>
          </div>

          <button class="btn btn-warning" type="submit">File report</button>
        </form>
      </div>
    </div>
  </main>
  </form>
  </main>

  <!-- TODO: footer -->
