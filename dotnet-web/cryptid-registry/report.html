<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Cryptid Registry — Report a Sighting</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

  <!-- TODO: navbar (same as index.html, with Report marked active) -->
  <nav class="navbar navbar-expand-md">
    <div class="container">
      <a class="navbar-brand" href="index.html">The Cryptid Registry</a>
      <div class="navbar-nav">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="registry.html">Registry</a>
        <a class="nav-link active" href="report.html">Report a Sighting</a>
      </div>
    </div>
  </nav>

  <!-- TODO: give <main> a container (all pages) — `class="container py-5"` -->
  <main class="container py-5">
    <h1>Report a Sighting</h1>

    <!-- TODO: alert alert-info — "nothing is saved yet" (that's week 6's problem) -->
    <div class="alert alert-info" role="alert">
      Nothing is saved yet—that's week 6's problem.
    </div>

    <!-- TODO: form — form-label + form-control for each field, form-select for the dropdown,
         submit button; keep the form ≤ 8 columns wide on md+ (hint: row + col-md-8) -->
    <div class="row">
      <div class="col-md-8">
        <form>
          <div class="mb-3">
            <label for="name">Your name</label>
            <input type="text" id="name">
          </div>

          <div class="mb-3">
            <label for="email">Email</label>
            <input type="email" id="email">
          </div>

          <div class="mb-3">
            <label for="cryptid">Which one did you see?</label>
            <select id="cryptid">
              <option>Choose…</option>
              <option>The Hodag</option>
              <option>Bigfoot</option>
              <option>Mothman</option>
              <option>The Loch Ness Monster</option>
              <option>The Jersey Devil</option>
              <option>Chupacabra</option>
              <option>Something not in the registry</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="account">What did you see?</label>
            <textarea id="account" rows="4"></textarea>
          </div>

          <button class="btn btn-primary" type="submit">File report</button>
        </form>
  </main>

  <!-- TODO: footer -->
  <footer class="text-center text-muted py-4">
    <p>© 2026 The Cryptid Registry</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="registry-checks.js"></script>
</body>

</html>
